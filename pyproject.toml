[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-drone-env"
version = "0.1.0"
description = "A Blender-compiled PyBullet drone environment for Diffusion Policies"
readme = "README.md"
requires-python = ">=3.8"

# 1. THE CORE ARCHITECTURE (Final/Production)
# The bare minimum required to run the physics engine and IPC bridge.
dependencies = [
    "gymnasium>=0.29.0",
    "gym-pybullet-drones>=1.0.0",
    "numpy",
    "websockets"
]

[tool.setuptools.packages.find]
include = ["custom_drone_env*"]

# ---------------------------------------------------------
# OPTIONAL DEPENDENCY PROFILES
# ---------------------------------------------------------
[project.optional-dependencies]

# 2. TESTERS
# For CI/CD pipelines or users who just need to run the test suite.
test = [
    "pytest>=7.0",
    "pytest-cov"
]

# 3. DEVELOPERS
# For contributors writing code. Includes linters, formatters, and testing tools.
dev = [
    "black",         # Code formatting
    "flake8",        # Linting
    "isort",         # Import sorting
    "custom-drone-env[test]" # Automatically includes the 'test' profile above
]

# 4. AI ARCHITECTS
# The heavy Deep Learning stack required to actually train the Diffusion Policy.
ai = [
    "torch>=2.0.0",
    "torchvision",
    "lerobot"        # Hugging Face's robotics library
]

# 5. ALL (The "Give me everything" command)
# Installs the physics engine, the dev tools, the test suite, and the AI stack.
all = [
    "custom-drone-env[dev,ai]"
]